services:
  gateway:
    build: .
    command: python -m uvicorn services.gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - STT_URL=http://stt:8001/transcribe
      - TTS_URL=http://tts:8005/synthesize
    depends_on:
      stt:
        condition: service_healthy
      tts:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  stt:
    build: .
    command: python -m uvicorn services.stt.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  tts:
    build: .
    command: python -m uvicorn services.tts.main:app --host 0.0.0.0 --port 8005
    ports:
      - "8005:8005"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

# NOTE: This standalone demo has NO external dependencies besides Sarvam AI.
#
# Team C's `DB-Team-C` service (Postgres/Supabase-backed auth + conversation
# API) and the `redis` service (previously used for appointment-booking
# state) have both intentionally been removed from this compose file.
# Login, conversation sessions, appointments, and in-progress booking state
# are all held in plain Python memory for the life of the process -- see
# services/demo_store.py and services/orchestrator/state_machine.py.
#
# To bring either back later: restore the relevant service block from git
# history, and point TEAM_C_BASE_URL / REDIS_URL at it again.
