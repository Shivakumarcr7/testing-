<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Zenvy — AI Hospital Assistant</title>

<style>

/* =========================================================
   ZENVY PREMIUM UI
   ========================================================= */

:root {
  --bg: #070a13;
  --bg2: #0d1020;
  --card: rgba(18, 23, 42, 0.72);
  --card-hover: rgba(24, 30, 53, 0.82);

  --text: #f7f8ff;
  --muted: #9ba3bb;

  --purple: #8b5cf6;
  --purple-light: #a78bfa;
  --cyan: #22d3ee;
  --green: #34d399;
  --red: #fb7185;

  --border: rgba(255,255,255,0.09);

  --shadow:
    0 25px 70px rgba(0,0,0,0.35);

  --radius: 22px;
}


/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {

  margin: 0;

  min-height: 100vh;

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: var(--text);

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(139,92,246,0.20),
      transparent 30%
    ),

    radial-gradient(
      circle at 85% 20%,
      rgba(34,211,238,0.12),
      transparent 28%
    ),

    radial-gradient(
      circle at 50% 100%,
      rgba(139,92,246,0.10),
      transparent 35%
    ),

    linear-gradient(
      135deg,
      #060812 0%,
      #0b0f1d 50%,
      #070914 100%
    );

  padding:
    35px
    18px
    70px;
}


/* =========================================================
   MAIN WIDTH
   ========================================================= */

body > * {

  width: 100%;

  max-width: 850px;

  margin-left: auto;
  margin-right: auto;

}


/* =========================================================
   HEADER
   ========================================================= */

h1 {

  position: relative;

  text-align: center;

  margin:
    15px
    auto
    8px;

  font-size:
    clamp(2rem, 5vw, 3.2rem);

  font-weight: 800;

  letter-spacing: -1.8px;

  line-height: 1.05;

  background:
    linear-gradient(
      90deg,
      #ffffff,
      #c4b5fd,
      #67e8f9
    );

  -webkit-background-clip: text;

  background-clip: text;

  color: transparent;

}


.sub {

  text-align: center;

  color: var(--muted);

  font-size: 0.95rem;

  margin:
    0
    0
    22px;

  letter-spacing: 0.2px;

}


/* =========================================================
   CARDS
   ========================================================= */

.card {

  position: relative;

  margin-top: 20px;

  padding: 27px;

  border:
    1px solid var(--border);

  border-radius:
    var(--radius);

  background:
    linear-gradient(
      145deg,
      rgba(20,25,45,0.82),
      rgba(11,15,29,0.70)
    );

  box-shadow:
    var(--shadow);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  overflow: hidden;

  transition:
    transform 0.25s ease,
    border-color 0.25s ease,
    background 0.25s ease;

}


.card::before {

  content: "";

  position: absolute;

  top: -100px;
  right: -100px;

  width: 220px;
  height: 220px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(139,92,246,0.12),
      transparent 70%
    );

  pointer-events: none;

}


.card:hover {

  border-color:
    rgba(167,139,250,0.22);

  background:
    var(--card-hover);

}


.card h2 {

  margin:
    0
    0
    7px;

  font-size:
    1.25rem;

  font-weight: 700;

  letter-spacing: -0.3px;

}


/* =========================================================
   LOGIN
   ========================================================= */

#loginView {

  max-width: 520px;

  margin:
    35px
    auto
    0;

}


#loginView h2 {

  text-align: center;

}


#loginView .sub {

  margin-bottom: 22px;

}


/* =========================================================
   INPUT
   ========================================================= */

input[type="tel"] {

  width: 100%;

  padding:
    15px
    17px;

  border:
    1px solid var(--border);

  border-radius:
    14px;

  outline: none;

  background:
    rgba(5,8,18,0.72);

  color:
    var(--text);

  font-family:
    inherit;

  font-size:
    1rem;

  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease,
    background 0.2s ease;

}


input[type="tel"]::placeholder {

  color:
    #697189;

}


input[type="tel"]:focus {

  border-color:
    rgba(139,92,246,0.75);

  box-shadow:
    0 0 0 4px
    rgba(139,92,246,0.10);

  background:
    rgba(8,11,23,0.9);

}


#loginButton {

  width: 100%;

  margin-top: 13px;

}


/* =========================================================
   BUTTONS
   ========================================================= */

.button {

  border: none;

  border-radius:
    13px;

  padding:
    13px
    20px;

  font-family:
    inherit;

  font-size:
    0.95rem;

  font-weight:
    700;

  color:
    white;

  cursor:
    pointer;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #8b5cf6
    );

  box-shadow:
    0 10px 28px
    rgba(124,58,237,0.25);

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    opacity 0.2s ease;

}


.button:hover {

  transform:
    translateY(-2px);

  box-shadow:
    0 15px 35px
    rgba(124,58,237,0.35);

}


.button:active {

  transform:
    translateY(0);

}


.button:disabled {

  opacity:
    0.45;

  cursor:
    not-allowed;

  transform:
    none;

}


/* =========================================================
   SIGNED IN BAR
   ========================================================= */

.signed-in-bar {

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    15px;

  margin-top:
    20px;

  padding:
    12px
    16px;

  border:
    1px solid var(--border);

  border-radius:
    14px;

  background:
    rgba(18,23,42,0.65);

  color:
    var(--muted);

  font-size:
    0.88rem;

  backdrop-filter:
    blur(15px);

}


.signed-in-bar strong {

  color:
    var(--text);

}


.link-button {

  border: none;

  background: transparent;

  padding: 4px;

  color:
    #a78bfa;

  font-family:
    inherit;

  font-size:
    0.85rem;

  font-weight:
    600;

  cursor:
    pointer;

  transition:
    color 0.2s ease;

}


.link-button:hover {

  color:
    #c4b5fd;

}


/* =========================================================
   VOICE ASSISTANT
   ========================================================= */

#appView {

  animation:
    fadeIn 0.5s ease;

}


#talkBtn {

  position: relative;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  width:
    190px;

  height:
    190px;

  margin:
    35px
    auto
    28px;

  border:
    1px solid
    rgba(167,139,250,0.25);

  border-radius:
    50%;

  color:
    white;

  font-family:
    inherit;

  font-size:
    1rem;

  font-weight:
    700;

  letter-spacing:
    0.2px;

  cursor:
    pointer;

  background:

    radial-gradient(
      circle at 35% 30%,
      rgba(255,255,255,0.16),
      transparent 28%
    ),

    linear-gradient(
      145deg,
      #7c3aed,
      #5b21b6
    );

  box-shadow:

    0 0 0 12px
    rgba(139,92,246,0.05),

    0 0 55px
    rgba(139,92,246,0.35),

    0 25px 55px
    rgba(0,0,0,0.45);

  transition:
    transform 0.25s ease,
    box-shadow 0.25s ease;

}


#talkBtn::before {

  content: "🎙";

  position: absolute;

  top:
    28px;

  font-size:
    2rem;

  opacity:
    0.95;

}


#talkBtn:hover {

  transform:
    scale(1.035);

  box-shadow:

    0 0 0 15px
    rgba(139,92,246,0.05),

    0 0 75px
    rgba(139,92,246,0.45),

    0 30px 65px
    rgba(0,0,0,0.5);

}


#talkBtn.recording {

  background:
    radial-gradient(
      circle at 35% 30%,
      rgba(255,255,255,0.15),
      transparent 28%
    ),

    linear-gradient(
      145deg,
      #e11d48,
      #9f1239
    );

  box-shadow:

    0 0 0 15px
    rgba(244,63,94,0.08),

    0 0 70px
    rgba(244,63,94,0.55),

    0 25px 60px
    rgba(0,0,0,0.5);

  animation:
    recordingPulse 1.35s infinite;

}


#talkBtn:disabled {

  opacity:
    0.55;

  cursor:
    not-allowed;

}


/* =========================================================
   STATUS
   ========================================================= */

#status {

  text-align:
    center;

  min-height:
    26px;

  margin:
    4px
    0
    10px;

  color:
    #b9c0d4;

  font-size:
    0.92rem;

}


#status::before {

  content:
    "●";

  margin-right:
    7px;

  color:
    var(--green);

  font-size:
    0.65rem;

}


/* =========================================================
   VOICE CONVERSATION
   ========================================================= */

.turn {

  margin-top:
    18px;

  padding:
    17px
    18px;

  border:
    1px solid var(--border);

  border-radius:
    16px;

  background:
    rgba(7,10,20,0.55);

  animation:
    slideUp 0.3s ease;

}


.turn .label {

  font-size:
    0.68rem;

  text-transform:
    uppercase;

  letter-spacing:
    0.9px;

  color:
    #8e98b1;

  font-weight:
    700;

}


.turn .text {

  margin:
    6px
    0
    14px;

  color:
    #eef0f8;

  line-height:
    1.6;

}


/* =========================================================
   ASK ZENVY
   ========================================================= */

textarea {

  width:
    100%;

  min-height:
    125px;

  padding:
    16px;

  border:
    1px solid var(--border);

  border-radius:
    15px;

  resize:
    vertical;

  outline:
    none;

  color:
    var(--text);

  background:
    rgba(5,8,18,0.65);

  font-family:
    inherit;

  font-size:
    0.98rem;

  line-height:
    1.5;

  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease;

}


textarea::placeholder {

  color:
    #697189;

}


textarea:focus {

  border-color:
    rgba(34,211,238,0.55);

  box-shadow:
    0 0 0 4px
    rgba(34,211,238,0.07);

}


.controls {

  display:
    flex;

  gap:
    10px;

  margin-top:
    12px;

}


select {

  flex:
    1;

  min-width:
    0;

  padding:
    13px
    14px;

  border:
    1px solid var(--border);

  border-radius:
    13px;

  outline:
    none;

  color:
    var(--text);

  background:
    rgba(5,8,18,0.75);

  font-family:
    inherit;

  cursor:
    pointer;

}


select option {

  background:
    #111528;

  color:
    white;

}


.controls .button {

  min-width:
    130px;

}


/* =========================================================
   ASK STATUS
   ========================================================= */

.status {

  margin-top:
    12px;

  color:
    #858fa8;

  font-size:
    0.84rem;

}


/* =========================================================
   USER QUESTION
   ========================================================= */

.input-display {

  margin-top:
    17px;

  padding:
    16px;

  border:
    1px solid
    rgba(34,211,238,0.12);

  border-radius:
    15px;

  background:
    rgba(34,211,238,0.035);

}


.input-display .label {

  font-size:
    0.68rem;

  text-transform:
    uppercase;

  letter-spacing:
    0.9px;

  color:
    #67e8f9;

  font-weight:
    700;

}


.input-display .text {

  margin-top:
    7px;

  color:
    #e5e7eb;

  line-height:
    1.55;

}


/* =========================================================
   ASSISTANT ANSWER
   ========================================================= */

.assistant-answer {

  margin-top:
    14px;

  padding:
    18px;

  border:
    1px solid
    rgba(139,92,246,0.20);

  border-radius:
    16px;

  background:

    linear-gradient(
      145deg,
      rgba(139,92,246,0.10),
      rgba(34,211,238,0.035)
    );

  box-shadow:
    0 15px 35px
    rgba(0,0,0,0.18);

}


.assistant-answer .label {

  font-size:
    0.68rem;

  text-transform:
    uppercase;

  letter-spacing:
    0.9px;

  color:
    #a78bfa;

  font-weight:
    800;

}


.assistant-answer .answer-text {

  margin-top:
    9px;

  color:
    #f1f3fa;

  line-height:
    1.65;

  white-space:
    pre-wrap;

}


/* =========================================================
   LOGIN STATUS
   ========================================================= */

#loginStatus {

  text-align:
    center;

  color:
    #fb7185;

}


/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes recordingPulse {

  0% {

    transform:
      scale(1);

  }

  50% {

    transform:
      scale(1.035);

  }

  100% {

    transform:
      scale(1);

  }

}


@keyframes fadeIn {

  from {

    opacity:
      0;

    transform:
      translateY(12px);

  }

  to {

    opacity:
      1;

    transform:
      translateY(0);

  }

}


@keyframes slideUp {

  from {

    opacity:
      0;

    transform:
      translateY(10px);

  }

  to {

    opacity:
      1;

    transform:
      translateY(0);

  }

}


/* =========================================================
   SCROLLBAR
   ========================================================= */

::-webkit-scrollbar {

  width:
    8px;

}


::-webkit-scrollbar-track {

  background:
    #080b14;

}


::-webkit-scrollbar-thumb {

  background:
    #292f46;

  border-radius:
    10px;

}


::-webkit-scrollbar-thumb:hover {

  background:
    #3d4563;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

  body {

    padding:
      22px
      12px
      50px;

  }


  h1 {

    font-size:
      2rem;

    letter-spacing:
      -1px;

  }


  .card {

    padding:
      20px;

    border-radius:
      18px;

  }


  #talkBtn {

    width:
      165px;

    height:
      165px;

    margin:
      30px
      auto
      25px;

  }


  .controls {

    flex-direction:
      column;

  }


  select,
  .controls .button {

    width:
      100%;

    min-width:
      100%;

  }


  .signed-in-bar {

    align-items:
      flex-start;

  }

}

</style>

</head>


<body>


<h1>
  🏥 Zenvy
</h1>

<p class="sub">
  AI-Powered Hospital Voice Assistant
  <br>
  <span style="font-size:0.82rem;">
    Kannada · Hindi · English
  </span>
</p>


<!-- =====================================================
     LOGIN
     ===================================================== -->

<div
  class="card"
  id="loginView"
  style="display:none;"
>

  <h2>
    🔐 Patient Login
  </h2>

  <p class="sub">
    Enter your phone number to continue
  </p>

  <form id="loginForm">

    <input
      type="tel"
      id="loginPhone"
      inputmode="numeric"
      autocomplete="tel"
      placeholder="10-digit mobile number"
    >

    <button
      class="button"
      id="loginButton"
      type="submit"
    >
      Continue
    </button>

  </form>

  <div
    id="loginStatus"
    class="status"
  ></div>

</div>


<!-- =====================================================
     APP
     ===================================================== -->

<div
  id="appView"
  style="display:none;"
>


  <!-- =====================================================
       SIGNED IN
       ===================================================== -->

  <div class="signed-in-bar">

    <span>

      🟢 Signed in as

      <strong id="signedInPhone"></strong>

    </span>

    <button
      class="link-button"
      id="logoutButton"
      type="button"
    >
      Log out
    </button>

  </div>


  <!-- =====================================================
       VOICE ASSISTANT
       ===================================================== -->

  <div class="card">

    <h2>
      🎙️ Talk to Zenvy
    </h2>

    <p class="sub">
      Press and hold the button to speak
    </p>

    <button id="talkBtn">
      Hold to talk
    </button>

    <div id="status">
      Ready
    </div>

    <div id="log"></div>

  </div>


  <!-- =====================================================
       ASK ZENVY
       ===================================================== -->

  <div class="card">

    <h2>
      ✨ Ask Zenvy
    </h2>

    <p class="sub">
      Type your question and let Zenvy help you
    </p>

    <textarea
      id="askText"
      placeholder="Example: What are the OPD timings?"
    ></textarea>


    <div class="controls">

      <select id="askLanguage">

        <option value="en">
          English
        </option>

        <option value="hi">
          Hindi
        </option>

        <option value="kn">
          Kannada
        </option>

      </select>


      <button
        class="button"
        id="askButton"
      >
        Ask Zenvy
      </button>

    </div>


    <div
      id="askStatus"
      class="status"
    >
      Ready
    </div>


    <!-- USER QUESTION -->

    <div
      id="userQuestion"
      class="input-display"
      style="display:none;"
    >

      <div class="label">
        Your Question
      </div>

      <div
        id="userQuestionText"
        class="text"
      ></div>

    </div>


    <!-- ASSISTANT ANSWER -->

    <div
      id="assistantAnswer"
      class="assistant-answer"
      style="display:none;"
    >

      <div class="label">
        Zenvy's Answer
      </div>

      <div
        id="assistantAnswerText"
        class="answer-text"
      ></div>

    </div>

  </div>

</div>


<script>


/* =========================================================
   GLOBAL SESSION
   ========================================================= */

let currentSessionId = null;


/* =========================================================
   LOGIN
   ========================================================= */

const AUTH_STORAGE_KEY = "zenvy_auth";


const loginView =
  document.getElementById("loginView");


const appView =
  document.getElementById("appView");


const loginForm =
  document.getElementById("loginForm");


const loginPhone =
  document.getElementById("loginPhone");


const loginButton =
  document.getElementById("loginButton");


const loginStatus =
  document.getElementById("loginStatus");


const signedInPhone =
  document.getElementById("signedInPhone");


const logoutButton =
  document.getElementById("logoutButton");


function getStoredAuth() {

  try {

    const raw =
      localStorage.getItem(
        AUTH_STORAGE_KEY
      );

    if (!raw) {

      return null;

    }

    const parsed =
      JSON.parse(raw);

    if (
      parsed &&
      parsed.phone_no
    ) {

      return parsed;

    }

    return null;

  }

  catch {

    return null;

  }

}


function appendAuthId(formData) {

  const auth =
    getStoredAuth();

  if (
    auth &&
    auth.auth_id
  ) {

    formData.append(
      "auth_id",
      auth.auth_id
    );

  }

}


function showLogin() {

  loginView.style.display =
    "block";

  appView.style.display =
    "none";

}


function showApp(auth) {

  signedInPhone.textContent =
    auth.phone_no;

  loginView.style.display =
    "none";

  appView.style.display =
    "block";

}


function applyAuthState() {

  const auth =
    getStoredAuth();

  if (auth) {

    showApp(auth);

  }

  else {

    showLogin();

  }

}


loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const phone =
      loginPhone.value.trim();

    if (!phone) {

      loginStatus.textContent =
        "Please enter your phone number.";

      loginPhone.focus();

      return;

    }

    loginButton.disabled =
      true;

    loginStatus.textContent =
      "Checking...";

    try {

      const formData =
        new FormData();

      formData.append(
        "phone_no",
        phone
      );

      const response =
        await fetch(
          "/channels/web/login",
          {
            method: "POST",
            body: formData
          }
        );

      if (!response.ok) {

        let message =
          response.statusText;

        try {

          const error =
            await response.json();

          if (
            typeof error.detail ===
            "string"
          ) {

            message =
              error.detail;

          }

          else if (
            Array.isArray(error.detail)
          ) {

            message =
              "Please enter a valid 10-digit phone number.";

          }

        }

        catch {}

        throw new Error(
          message
        );

      }

      const data =
        await response.json();

      currentSessionId =
        null;

      try {

        localStorage.setItem(

          AUTH_STORAGE_KEY,

          JSON.stringify({

            auth_id:
              data.auth_id,

            phone_no:
              data.phone_no

          })

        );

      }

      catch {}

      loginStatus.textContent =
        "";

      loginPhone.value =
        "";

      showApp(data);

    }

    catch (err) {

      console.error(
        "[Login] Error:",
        err
      );

      loginStatus.textContent =
        err.message;

    }

    finally {

      loginButton.disabled =
        false;

    }

  }
);


logoutButton.addEventListener(
  "click",
  function() {

    try {

      localStorage.removeItem(
        AUTH_STORAGE_KEY
      );

    }

    catch {}

    currentSessionId =
      null;

    loginStatus.textContent =
      "";

    showLogin();

  }
);


applyAuthState();


/* =========================================================
   VOICE ASSISTANT
   ========================================================= */

const talkBtn =
  document.getElementById("talkBtn");


const statusEl =
  document.getElementById("status");


const logEl =
  document.getElementById("log");


let mediaRecorder = null;

let audioChunks = [];

let recordingStartTime = 0;

const MIN_RECORDING_MS = 600;


/* =========================================================
   START RECORDING
   ========================================================= */

async function startRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state === "recording"
  ) {

    return;

  }

  try {

    talkBtn.classList.add(
      "recording"
    );

    talkBtn.textContent =
      "Starting...";

    statusEl.textContent =
      "Requesting microphone...";

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio: true
        });

    mediaRecorder =
      new MediaRecorder(
        stream
      );

    audioChunks = [];

    mediaRecorder.addEventListener(
      "dataavailable",
      event => {

        if (
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );

        }

      }
    );

    mediaRecorder.addEventListener(
      "stop",
      async () => {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

        const audioBlob =
          new Blob(
            audioChunks,
            {
              type:
                "audio/webm"
            }
          );

        await sendVoiceToGateway(
          audioBlob
        );

      }
    );

    mediaRecorder.start();

    recordingStartTime =
      Date.now();

    talkBtn.textContent =
      "Release to send";

    statusEl.textContent =
      "Listening...";

  }

  catch (err) {

    talkBtn.classList.remove(
      "recording"
    );

    talkBtn.textContent =
      "Hold to talk";

    statusEl.textContent =
      "Microphone error: " +
      err.message;

  }

}


/* =========================================================
   STOP RECORDING
   ========================================================= */

function stopRecording() {

  if (
    !mediaRecorder ||
    mediaRecorder.state !==
      "recording"
  ) {

    return;

  }

  const elapsed =
    Date.now() -
    recordingStartTime;

  const remaining =
    MIN_RECORDING_MS -
    elapsed;

  talkBtn.classList.remove(
    "recording"
  );

  talkBtn.textContent =
    "Hold to talk";

  if (
    remaining > 0
  ) {

    statusEl.textContent =
      "Hold a little longer...";

    setTimeout(() => {

      if (
        mediaRecorder &&
        mediaRecorder.state ===
          "recording"
      ) {

        mediaRecorder.stop();

      }

    }, remaining);

  }

  else {

    mediaRecorder.stop();

  }

}


/* =========================================================
   SEND VOICE
   ========================================================= */

async function sendVoiceToGateway(
  audioBlob
) {

  talkBtn.disabled =
    true;

  statusEl.textContent =
    "Thinking...";

  const formData =
    new FormData();

  formData.append(
    "file",
    audioBlob,
    "input.webm"
  );

  if (
    currentSessionId
  ) {

    formData.append(
      "session_id",
      currentSessionId
    );

  }

  appendAuthId(
    formData
  );

  try {

    const response =
      await fetch(
        "/channels/web/chat",
        {
          method: "POST",
          body: formData
        }
      );

    if (!response.ok) {

      let message =
        response.statusText;

      try {

        const error =
          await response.json();

        message =
          error.detail ||
          message;

      }

      catch {}

      throw new Error(
        message
      );

    }

    const transcript =
      decodeHeader(
        response.headers.get(
          "X-Transcript"
        )
      );

    const replyText =
      decodeHeader(
        response.headers.get(
          "X-Reply-Text"
        )
      );

    const language =
      response.headers.get(
        "X-Language"
      ) || "";

    const sessionId =
      response.headers.get(
        "X-Session-Id"
      );

    if (
      sessionId
    ) {

      currentSessionId =
        sessionId;

    }

    const audioBlobReply =
      await response.blob();

    const audioUrl =
      URL.createObjectURL(
        audioBlobReply
      );

    const audio =
      new Audio(
        audioUrl
      );

    addVoiceTurn(
      transcript,
      replyText,
      language
    );

    statusEl.textContent =
      "Playing reply...";

    await audio.play();

    audio.onended = () => {

      statusEl.textContent =
        "Ready";

      talkBtn.disabled =
        false;

      URL.revokeObjectURL(
        audioUrl
      );

    };

  }

  catch (err) {

    statusEl.textContent =
      "Request failed: " +
      err.message;

    talkBtn.disabled =
      false;

  }

}


/* =========================================================
   HEADER DECODER
   ========================================================= */

function decodeHeader(
  value
) {

  if (!value) {

    return "";

  }

  try {

    return decodeURIComponent(
      value
    );

  }

  catch {

    return value;

  }

}


/* =========================================================
   ADD VOICE TURN
   ========================================================= */

function addVoiceTurn(
  heard,
  reply,
  lang
) {

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "turn";

  const heardLabel =
    document.createElement(
      "div"
    );

  heardLabel.className =
    "label";

  heardLabel.textContent =
    "You said (" +
    lang +
    ")";

  const heardDiv =
    document.createElement(
      "div"
    );

  heardDiv.className =
    "text";

  heardDiv.textContent =
    heard;

  const replyLabel =
    document.createElement(
      "div"
    );

  replyLabel.className =
    "label";

  replyLabel.textContent =
    "Zenvy";

  const replyDiv =
    document.createElement(
      "div"
    );

  replyDiv.className =
    "text";

  replyDiv.textContent =
    reply;

  div.appendChild(
    heardLabel
  );

  div.appendChild(
    heardDiv
  );

  div.appendChild(
    replyLabel
  );

  div.appendChild(
    replyDiv
  );

  logEl.prepend(
    div
  );

}


/* =========================================================
   MOUSE CONTROLS
   ========================================================= */

talkBtn.addEventListener(
  "mousedown",
  startRecording
);

talkBtn.addEventListener(
  "mouseup",
  stopRecording
);

talkBtn.addEventListener(
  "mouseleave",
  () => {

    if (
      mediaRecorder &&
      mediaRecorder.state ===
        "recording"
    ) {

      stopRecording();

    }

  }
);


/* =========================================================
   TOUCH CONTROLS
   ========================================================= */

talkBtn.addEventListener(
  "touchstart",
  event => {

    event.preventDefault();

    startRecording();

  }
);

talkBtn.addEventListener(
  "touchend",
  event => {

    event.preventDefault();

    stopRecording();

  }
);


/* =========================================================
   ASK ZENVY
   ========================================================= */

const askText =
  document.getElementById(
    "askText"
  );

const askLanguage =
  document.getElementById(
    "askLanguage"
  );

const askButton =
  document.getElementById(
    "askButton"
  );

const askStatus =
  document.getElementById(
    "askStatus"
  );

const userQuestion =
  document.getElementById(
    "userQuestion"
  );

const userQuestionText =
  document.getElementById(
    "userQuestionText"
  );

const assistantAnswer =
  document.getElementById(
    "assistantAnswer"
  );

const assistantAnswerText =
  document.getElementById(
    "assistantAnswerText"
  );


/* =========================================================
   ASK BUTTON
   ========================================================= */

askButton.addEventListener(
  "click",
  askZenvy
);


async function askZenvy() {

  const text =
    askText.value.trim();

  const language =
    askLanguage.value;

  if (!text) {

    askStatus.textContent =
      "Please enter your question.";

    askText.focus();

    return;

  }

  askButton.disabled =
    true;

  askStatus.textContent =
    "Zenvy is thinking...";

  assistantAnswer.style.display =
    "none";

  userQuestion.style.display =
    "none";

  try {

    const formData =
      new FormData();

    formData.append(
      "text",
      text
    );

    formData.append(
      "language",
      language
    );

    if (
      currentSessionId
    ) {

      formData.append(
        "session_id",
        currentSessionId
      );

    }

    appendAuthId(
      formData
    );

    const response =
      await fetch(
        "/channels/web/ask",
        {
          method: "POST",
          body: formData
        }
      );

    if (!response.ok) {

      let message =
        response.statusText;

      try {

        const error =
          await response.json();

        message =
          error.detail ||
          error.message ||
          message;

      }

      catch {}

      throw new Error(
        message
      );

    }

    const data =
      await response.json();

    if (
      data.success === false
    ) {

      throw new Error(
        data.message ||
        "Zenvy could not generate a response."
      );

    }

    const reply =
      data.reply || "";

    if (!reply) {

      throw new Error(
        "Zenvy returned an empty answer."
      );

    }

    if (
      data.session_id
    ) {

      currentSessionId =
        data.session_id;

    }

    userQuestionText.textContent =
      data.input || text;

    userQuestion.style.display =
      "block";

    askText.value =
      "";

    assistantAnswerText.textContent =
      reply;

    assistantAnswer.style.display =
      "block";

    askStatus.textContent =
      "Zenvy answered ✓";

  }

  catch (err) {

    console.error(
      "[Ask Zenvy] Error:",
      err
    );

    askStatus.textContent =
      "Error: " +
      err.message;

  }

  finally {

    askButton.disabled =
      false;

  }

}


/* =========================================================
   ENTER KEY
   ========================================================= */

askText.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      askZenvy();

    }

  }
);

</script>
